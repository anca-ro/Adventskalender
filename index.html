<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2c">
  <meta name="description" content="Der digitale Adventskalender">
  <title>Der digitale Adventskalender 🎄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="snow">✦ ❄ ✦</div>
      <p class="eyebrow">DER DIGITALE</p>
      <h1>Adventskalender</h1>
      <p class="subtitle">Jeden Tag ein kleines Türchen für die Pause.</p>
      <div id="status" class="status"></div>
    </header>

    <section id="calendar" class="calendar" aria-label="Adventskalender"></section>

    <section class="highscores" aria-labelledby="highscoresTitle">
      <div class="highscores-heading">
        <button id="toggleHighscores" class="highscores-toggle" type="button" aria-expanded="true" aria-controls="highscoresPanel">
          <span>
            <span class="eyebrow">DEINE BESTEN RUNDEN</span>
            <span id="highscoresTitle" class="highscores-title" role="heading" aria-level="2">🏆 Minispiel-Highscores</span>
          </span>
          <span class="highscores-chevron" aria-hidden="true">⌄</span>
        </button>
        <button id="resetHighscores" class="reset-highscores" type="button">Zurücksetzen</button>
      </div>
      <div id="highscoresPanel">
        <ol id="highscoresList" class="highscores-list" aria-live="polite"></ol>
        <p class="highscores-note">Highscores werden in diesem Browser gespeichert.</p>
      </div>
    </section>

    <section id="today" class="today hidden" aria-live="polite">
      <div class="today-inner">
        <div class="today-top">
          <span id="todayEmoji" class="today-emoji"></span>
          <div>
            <div class="today-label">TÜRCHEN <span id="todayNumber"></span></div>
            <h2 id="todayTitle"></h2>
          </div>
        </div>
        <div id="todayContent" class="today-content"></div>
      </div>
    </section>

    <footer>
      <span>🎄 Frohe Adventszeit!</span>
      <span id="year"></span>
    </footer>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
