<body>
<canvas id="snow" aria-hidden="true"></canvas>
<audio id="backgroundMusic" loop preload="auto"><source src="audio/Ein%20Geschenk%20ist%20nicht%20genug.mp3" type="audio/mpeg"></audio>
<div class="app" id="app"></div>
<section class="start-overlay" id="startOverlay" aria-modal="true" role="dialog" hidden></section>
<section class="end-overlay" id="endOverlay" aria-modal="true" role="dialog" hidden></section>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
(()=>{"use strict";
// Round data lives in state; rule records below drive both handbook text and decisions.
const $=s=>document.querySelector(s);
const COLOR_NAMES={red:"Rot",green:"Grün",gold:"Gold",white:"Weiß",blue:"Blau"};
const COLOR_CODES={red:"R",green:"G",gold:"Au",white:"W",blue:"B"};
const WIRE_RULES={
  3:[
    {id:"two-red",text:"Wenn mindestens zwei rote Kabel vorhanden sind: das letzte rote Kabel schneiden.",test:(w)=>w.filter(x=>x==="red").length>=2,choose:(w)=>w.lastIndexOf("red")},
    {id:"last-white",text:"Sonst, wenn das letzte Kabel weiß ist: das mittlere Kabel schneiden.",test:(w)=>w[w.length-1]==="white",choose:(w)=>1},
    {id:"one-blue",text:"Sonst, wenn genau ein blaues Kabel vorhanden ist: dieses blaue Kabel schneiden.",test:(w)=>w.filter(x=>x==="blue").length===1,choose:(w)=>w.indexOf("blue")},
    {id:"fallback",text:"Sonst: das letzte Kabel schneiden.",test:()=>true,choose:(w)=>w.length-1}
  ],
  4:[
    {id:"no-red-odd",text:"Wenn kein rotes Kabel vorhanden ist und die letzte Seriennummer-Ziffer ungerade ist: das erste Kabel schneiden.",test:(w,c)=>!w.includes("red")&&c.odd,choose:()=>0},
    {id:"one-gold",text:"Sonst, wenn genau ein goldenes Kabel vorhanden ist: das letzte goldene Kabel schneiden.",test:(w)=>w.filter(x=>x==="gold").length===1,choose:(w)=>w.lastIndexOf("gold")},
    {id:"last-green",text:"Sonst, wenn das letzte Kabel grün ist: das erste grüne Kabel schneiden.",test:(w)=>w[w.length-1]==="green",choose:(w)=>w.indexOf("green")},
    {id:"fallback",text:"Sonst: das zweite Kabel schneiden.",test:()=>true,choose:()=>1}
  ],
  5:[
    {id:"blue-odd",text:"Wenn das letzte Kabel blau ist und die letzte Seriennummer-Ziffer ungerade ist: das vierte Kabel schneiden.",test:(w,c)=>w[4]==="blue"&&c.odd,choose:()=>3},
    {id:"red-whites",text:"Sonst, wenn genau ein rotes und mindestens zwei weiße Kabel vorhanden sind: das rote Kabel schneiden.",test:(w)=>w.filter(x=>x==="red").length===1&&w.filter(x=>x==="white").length>=2,choose:(w)=>w.indexOf("red")},
    {id:"no-gold",text:"Sonst, wenn kein goldenes Kabel vorhanden ist: das zweite Kabel schneiden.",test:(w)=>!w.includes("gold"),choose:()=>1},
    {id:"first-green",text:"Sonst, wenn das erste Kabel grün ist: das letzte grüne Kabel schneiden.",test:(w)=>w[0]==="green",choose:(w)=>w.lastIndexOf("green")},
    {id:"fallback",text:"Sonst: das dritte Kabel schneiden.",test:()=>true,choose:()=>2}
  ],
  6:[
    {id:"no-blue",text:"Wenn kein blaues Kabel vorhanden ist: das letzte Kabel schneiden.",test:(w)=>!w.includes("blue"),choose:(w)=>w.length-1},
    {id:"one-red-vowel",text:"Sonst, wenn genau ein rotes Kabel vorhanden ist und die Seriennummer einen Vokal enthält: das rote Kabel schneiden.",test:(w,c)=>w.filter(x=>x==="red").length===1&&c.vowel,choose:(w)=>w.indexOf("red")},
    {id:"even-gold",text:"Sonst, wenn die letzte Seriennummer-Ziffer gerade ist und mindestens zwei goldene Kabel vorhanden sind: das letzte goldene Kabel schneiden.",test:(w,c)=>!c.odd&&w.filter(x=>x==="gold").length>=2,choose:(w)=>w.lastIndexOf("gold")},
    {id:"last-white",text:"Sonst, wenn das letzte Kabel weiß ist: das erste weiße Kabel schneiden.",test:(w)=>w[w.length-1]==="white",choose:(w)=>w.indexOf("white")},
    {id:"fallback",text:"Sonst: das vorletzte Kabel schneiden.",test:()=>true,choose:(w)=>w.length-2}
  ]
};
const BUTTON_RULES=[
  {id:"halt",text:"Wenn die Aufschrift HALT lautet: kurz drücken und sofort loslassen.",test:(m)=>m.label==="HALT",action:"tap"},
  {id:"star-lights",text:"Sonst, wenn die Anzeige STERN leuchtet und mindestens zwei Kerzen-Batterien vorhanden sind: gedrückt halten.",test:(m,c)=>c.indicators.STERN&&c.batteries>=2,action:"hold"},
  {id:"blue-vowel",text:"Sonst, wenn die Seriennummer einen Vokal enthält und der Knopf blau ist: gedrückt halten.",test:(m,c)=>c.vowel&&m.color==="blue",action:"hold"},
  {id:"quiet-empty",text:"Sonst, wenn keine Kerzen-Batterie vorhanden ist und die Aufschrift STILLE lautet: kurz drücken und sofort loslassen.",test:(m,c)=>c.batteries===0&&m.label==="STILLE",action:"tap"},
  {id:"bell-gold",text:"Sonst, wenn die Anzeige GLOCKE leuchtet und der Knopf golden ist: kurz drücken und sofort loslassen.",test:(m,c)=>c.indicators.GLOCKE&&m.color==="gold",action:"tap"},
  {id:"default",text:"Sonst: gedrückt halten.",test:()=>true,action:"hold"}
];
const MODULE_META={
  wires:{title:"Lichterkette",icon:"〰️"},
  button:{title:"Glockenknopf",icon:"🔔"},
  symbols:{title:"Weihnachtsrunen",icon:"ᛟ"},
  simon:{title:"Lichterbaum",icon:"🎄"},
  password:{title:"Wunschzettel",icon:"✉️"}
};
const DIFFICULTIES={
  easy:{label:"Leicht",count:3,soloSeconds:300,bombSeconds:330},
  medium:{label:"Mittel",count:4,soloSeconds:240,bombSeconds:300},
  hard:{label:"Schwer",count:5,soloSeconds:210,bombSeconds:270}
};
const SYMBOL_COLUMNS=[
  ["❄️","🎄","⭐","🔔","🦌","🎁","🕯️"],
  ["🧦","⛄","🍪","🍬","🛷","🧤","🧣"],
  ["🌟","🎅","🤶","🧝","🧑‍🎄","🦉","🐻"],
  ["🦊","🐧","🌲","🌨️","☃️","🍊","🥛"],
  ["🥨","🍫","🪵","🔥","🏠","🌙","🔑"],
  ["🪄","🧸","🎀","🪽","🫎","🪅","🪇"]
];
const PASSWORD_WORDS=["STERN","KERZE","ENGEL","KRANZ","KUGEL","TANNE","NACHT","GABEN","KAKAO","ELCHE","KARTE","FROST","LICHT","LEISE","KAMIN"];
const SIMON_MAPS={
  yes:{
    0:{red:"blue",green:"red",gold:"green",blue:"gold"},
    1:{red:"green",green:"gold",gold:"blue",blue:"red"},
    2:{red:"gold",green:"blue",gold:"red",blue:"green"}
  },
  no:{
    0:{red:"gold",green:"blue",gold:"red",blue:"green"},
    1:{red:"blue",green:"gold",gold:"red",blue:"green"},
    2:{red:"green",green:"red",gold:"blue",blue:"gold"}
  }
};
// This single, fixed rule source feeds both the handbook and module validation.
const rules={
  wires:WIRE_RULES,
  button:BUTTON_RULES,
  timerDigits:{red:1,green:3,gold:5,white:7,blue:9},
  symbolColumns:SYMBOL_COLUMNS,
  passwordWords:PASSWORD_WORDS,
  simonMaps:SIMON_MAPS
};
const state={phase:"menu",difficulty:"medium",seed:"",seedSpecified:false,rng:null,caseInfo:null,modules:[],strikes:null,remaining:null,totalTime:null,manualPage:null,lastTick:null,lastFrame:0,generation:0,colorblind:false,lastIncident:null};
let mode="solo",audioContext=null,muted=false,snowFrameId=0,gameFrameId=0,keyboardHoldId=null;
const moduleMap={
  wires:{
    init(){const n=randInt(3,6);return{wires:Array.from({length:n},()=>pick(["red","green","gold","white","blue"])),feedback:"Schneide genau das Kabel, das die erste zutreffende Handbuchregel nennt."}},
    render(m){return'<div class="wire-row">'+m.wires.map((c,i)=>'<button class="wire-button" type="button" data-action="wire-cut" data-index="'+i+'" aria-label="Kabel '+(i+1)+", "+COLOR_NAMES[c]+'"><span class="wire-line '+c+'"></span><span class="wire-code">'+(state.colorblind?COLOR_CODES[c]:COLOR_CODES[c])+'</span></button>').join("")+'</div><p class="action-note">'+m.wires.length+' Kabel · Kürzel helfen beim Erkennen</p>'},
    input(m,a,d){if(a!=="wire-cut"||m.solved)return;const rule=wireRule(m),index=Number(d.index);if(index===rule.choose(m.wires)){solveModule(m,"Die richtige Stelle der Lichterkette ist durchtrennt.");return}strike("Ein falsches Kabel wurde durchgeschnitten.",rule.text,m);},
    solved(m){return!!m.solved}
  },
  button:{
    init(){return{color:pick(["red","green","gold","blue"]),label:pick(["LÄUTEN","STILLE","HALT","HO-HO"]),holding:false,strip:pick(["red","green","gold","white","blue"]),feedback:"Knopf-Regel im Handbuch nachschlagen. Zum Halten Maus/Finger gedrückt lassen."}},
    render(m){const holding=m.holding;return'<div class="button-module"><button class="bell-button '+m.color+(holding?" pressed":"")+'" type="button" data-action="bell-press" aria-label="'+m.label+" "+COLOR_NAMES[m.color]+(holding?", gedrückt halten":", kurz drücken")+'">'+m.label+'</button><span class="timer-strip '+m.strip+'" style="'+(holding?"opacity:1":"opacity:.25")+'" aria-label="Farbstreifen '+COLOR_NAMES[m.strip]+'"></span><p class="action-note">'+(holding?"Loslassen, wenn die Ziffer "+rules.timerDigits[m.strip]+" im Countdown steht.":"Knopf: "+COLOR_NAMES[m.color]+" · Aufschrift: "+m.label)+'</p></div>'},
    input(m,a){if(a!=="bell-press"||m.solved)return;if(state.phase!=="playing")return;const rule=buttonRule(m);if(rule.action==="tap"){solveModule(m,"Der Knopf wurde nach der Kurzdrück-Regel sofort losgelassen.");return}if(!m.holding){m.holding=true;m.feedback="Gedrückt halten. Warte, bis die Ziffer "+rules.timerDigits[m.strip]+" im Countdown erscheint, dann loslassen.";renderModules();setStatus("Knopf gehalten – Timer läuft weiter. Loslassen beim passenden Ziffern-Treffer.");return}const digit=rules.timerDigits[m.strip],digits=formatTime(state.remaining).replace(":","");m.holding=false;if(digits.includes(String(digit))){solveModule(m,"Der Knopf wurde beim richtigen Ziffern-Treffer losgelassen.");return}strike("Der Knopf wurde beim falschen Ziffernstand losgelassen.",'Der Farbstreifen '+COLOR_NAMES[m.strip]+' verlangt die Ziffer '+digit+'. Warte, bis sie in mm:ss sichtbar ist.',m);},
    solved(m){return!!m.solved}
  },
  symbols:{
    init(){const colIndex=randInt(0,5),column=rules.symbolColumns[colIndex],positions=shuffle([0,1,2,3,4,5,6]).slice(0,4),display=shuffle(positions.slice()).map(i=>column[i]),correct=positions.slice().sort((a,b)=>a-b).map(i=>column[i]);return{column:colIndex,display,correct,progress:0,used:[],feedback:"Finde die gemeinsame Handbuchspalte und tippe ihre vier Runen von oben nach unten."}},
    render(m){return'<div class="symbol-picks">'+m.display.map((s,i)=>'<button class="symbol-pick '+(m.used.includes(i)?"used":"")+'" type="button" data-action="symbol-pick" data-index="'+i+'" '+(m.used.includes(i)?"disabled":"")+' aria-label="Rune '+s+'">'+s+'</button>').join("")+'</div><p class="action-note">Runen gewählt: '+m.progress+' / 4</p>'},
    input(m,a,d){if(a!=="symbol-pick"||m.solved)return;const idx=Number(d.index),symbol=m.display[idx];if(symbol===m.correct[m.progress]){m.used.push(idx);m.progress++;if(m.progress>=4){solveModule(m,"Alle vier Runen kamen in der Handbuchreihenfolge.");return}m.feedback="Richtig. Weiter mit der nächsten Rune der Spalte.";renderModules();playClick();return}m.progress=0;m.used=[];strike("Die Runen wurden nicht in der passenden Handbuchreihenfolge gedrückt.",'Finde die eine Spalte, die alle vier Runen enthält, und wähle sie von oben nach unten.',m);},
    solved(m){return m.progress>=4}
  },
  simon:{
    init(){return{sequence:Array.from({length:4},()=>pick(["red","green","gold","blue"])),stage:1,inputIndex:0,flash:null,playing:false,feedback:"Sieh dir das Signal an. Die Regel richtet sich nach Seriennummer-Vokal und aktuellen Fehlern."}},
    render(m){return'<div class="simon-wrap"><div class="simon-grid">'+["red","green","gold","blue"].map(c=>'<button class="simon-key '+c+(m.flash===c?" lit":"")+'" type="button" data-action="simon-color" data-value="'+c+'" '+(m.playing?"disabled":"")+' aria-label="'+COLOR_NAMES[c]+'">'+COLOR_NAMES[c]+'</button>').join("")+'</div><div class="simon-status">'+(m.playing?"Signal läuft …":"Stufe "+Math.min(4,m.stage)+" · Eingabe "+m.inputIndex+" / "+Math.min(4,m.stage))+'</div><button class="secondary tiny-button" type="button" data-action="simon-replay" '+(m.playing?"disabled":"")+'>'+ (m.playing?"Signal läuft":"🔁 Signal wiederholen")+'</button></div>'},
    input(m,a,d,id){if(a==="simon-replay"){if(!m.playing)playSimon(id,m);return}if(a!=="simon-color"||m.solved||m.playing)return;const expected=translatedSimon(m.sequence[m.inputIndex],state.strikes,state.caseInfo.vowel);if(d.value!==expected){m.stage=1;m.inputIndex=0;m.feedback="Fehler. Ab Stufe 1 wiederholen; die Farbübersetzung richtet sich jetzt nach "+state.strikes+" Fehlern.";strike("Ein falsches Licht wurde im Lichterbaum gedrückt.",simonHint(state.strikes,state.caseInfo.vowel),m);if(state.phase==="playing")playSimon(id,m);return}m.inputIndex++;if(m.inputIndex>=Math.min(4,m.stage)){m.stage++;m.inputIndex=0;if(m.stage>4){solveModule(m,"Alle vier Signalstufen wurden richtig übersetzt.");return}m.feedback="Stufe geschafft. Die nächste Signalfolge wird länger.";renderModules();playSimon(id,m);return}m.feedback="Richtiges Licht. Folge weiter dem übersetzten Signal.";renderModules();playClick();},
    solved(m){return m.stage>4}
  },
  password:{
    init(){const words=rules.passwordWords,target=pick(words),alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ",wheels=[];for(let i=0;i<5;i++){const forbidden=new Set(words.filter(w=>w!==target).map(w=>w[i]));forbidden.add(target[i]);const decoys=shuffle(alphabet.split("").filter(ch=>!forbidden.has(ch))).slice(0,5);wheels.push(shuffle([target[i],...decoys]))}return{target,wheels,indexes:wheels.map((w,i)=>w.indexOf(target[i])),feedback:"Finde das eine Wort, das in der Wortliste steht. Die Pfeile drehen jede Buchstabenscheibe."}},
    render(m){return'<div class="password-fields">'+m.wheels.map((w,i)=>'<div class="letter-wheel" aria-label="Buchstabenstelle '+(i+1)+'"><button class="secondary" type="button" data-action="pw-up" data-index="'+i+'" aria-label="Buchstabe nach oben">▲</button><output>'+w[m.indexes[i]]+'</output><button class="secondary" type="button" data-action="pw-down" data-index="'+i+'" aria-label="Buchstabe nach unten">▼</button></div>').join("")+'</div><button class="primary pw-submit" type="button" data-action="pw-submit">Absenden</button>'},
    input(m,a,d){const i=Number(d.index);if(a==="pw-up"||a==="pw-down"){m.indexes[i]=(m.indexes[i]+(a==="pw-up"?1:5))%6;renderModules();playClick();return}if(a!=="pw-submit"||m.solved)return;const word=m.wheels.map((w,j)=>w[m.indexes[j]]).join("");if(word===m.target){solveModule(m,"Das gesuchte Wort aus der Wichtel-Wortliste ist eingestellt.");return}strike('"'+word+'" steht nicht als passendes Lösungswort im Handbuch.',"Stelle ein Wort aus der fünfzehn Wörter umfassenden Liste ein.",m);},
    solved(m){return m.solved===true}
  }
};
const PAGE_NAMES={intro:"Übersicht",wires:"Lichterkette",button:"Knopf",symbols:"Runen",simon:"Lichterbaum",password:"Wunschzettel"};

function hashSeed(value){let h=2166136261;for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rand(){return state.rng()}function randInt(min,max){return Math.floor(rand()*(max-min+1))+min}function pick(a){return a[Math.floor(rand()*a.length)]}
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(seconds){const n=Math.max(0,Math.ceil(seconds)),m=Math.floor(n/60),s=n%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function makeCase(){const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",serial=Array.from({length:5},()=>alphabet[Math.floor(rand()*alphabet.length)]).join("")+String(randInt(0,9));const vowel=/[AEIOU]/.test(serial);const last=Number(serial[serial.length-1]);const indicators={STERN:rand()<.5,GLOCKE:rand()<.5,ENGEL:rand()<.5};return{serial,vowel,odd:last%2===1,batteries:randInt(0,4),indicators,last}}
function serialInfo(){return{serial:state.caseInfo.serial,vowel:state.caseInfo.vowel,odd:state.caseInfo.odd,batteries:state.caseInfo.batteries,indicators:state.caseInfo.indicators}}
function wireRule(m){const list=rules.wires[m.wires.length];return list.find(r=>r.test(m.wires,serialInfo()))}
function buttonRule(m){return rules.button.find(r=>r.test(m,serialInfo()))}

function filterManual(value){const q=value.toLowerCase();if(!q)return;const pages=Object.keys(PAGE_NAMES);const pageText={intro:"übersicht handbuch seriennummer kerzen anzeigen fehler",wires:"lichterkette kabel rot grün gold weiß blau schneiden seriennummer",button:"glockenknopf knopf läuten stille halt streifen timer batterie vokal",symbols:"runen symbole spalte reihenfolge",simon:"lichterbaum signal farben fehler seriennummer vokal",password:"wunschzettel passwort wort buchstaben absenden"};const match=pages.find(p=>pageText[p].includes(q))||pages.find(p=>PAGE_NAMES[p].toLowerCase().includes(q));if(match&&match!==state.manualPage){state.manualPage=match;renderManual();const search=$("#manualSearch");if(search)search.value=value;return}const page=$("#bookPage");if(page)page.querySelectorAll("li,p,h3,h4,td").forEach(el=>{el.hidden=!(el.textContent||"").toLowerCase().includes(q)})}function updateHud(){const clock=$("#clock");clock.textContent=formatTime(state.remaining);clock.classList.toggle("urgent",state.remaining<=30);document.querySelectorAll(".ornament").forEach((el,i)=>el.classList.toggle("broken",i<Math.min(state.strikes,3)));$("#ornaments").setAttribute("aria-label",Math.max(0,3-state.strikes)+" Kugeln intakt, "+state.strikes+" zerbrochen");$("#progress").textContent=state.modules.filter(m=>m.solved).length+" von "+state.modules.length+" gelöst"}
function setStatus(text,kind){const line=$("#statusLine");line.textContent=text;line.className="status-line"+(kind?" "+kind:"")}
function solveModule(m,message){if(state.phase!=="playing"||m.solved)return;m.solved=true;m.holding=false;m.feedback="✨ "+message;renderModules();playBell();setStatus(MODULE_META[m.type].title+" gelöst! "+message,"success");if(state.modules.every(x=>x.solved))finish(true)}
function strike(reason,hint,m){if(state.phase!=="playing")return;state.strikes++;state.lastIncident={reason,hint,module:m?MODULE_META[m.type].title:"Modul"};if(m){m.feedback="❌ "+reason+" Lies die Regel noch einmal nach."}playGlass();updateHud();renderModules();setStatus(reason+" Der Countdown läuft jetzt "+(1+state.strikes*.25).toFixed(2).replace(".",",")+"× schneller.","error");if(state.strikes>=3){finish(false,"strike");return}}
function solutionInstruction(m){
  if(m.type==="wires"){const rule=wireRule(m),index=rule.choose(m.wires,serialInfo());return rule.text+" Lösung: Kabel "+(index+1)+" ("+COLOR_NAMES[m.wires[index]]+") schneiden."}
  if(m.type==="button"){const rule=buttonRule(m);return rule.text+(rule.action==="tap"?" Lösung: kurz drücken und sofort loslassen.":" Lösung: gedrückt halten; beim Farbstreifen "+COLOR_NAMES[m.strip]+" loslassen, wenn die Ziffer "+rules.timerDigits[m.strip]+" in mm:ss erscheint.")}
  if(m.type==="symbols")return"Lösung: "+m.correct.join(" · ")+" in dieser Reihenfolge tippen."
  if(m.type==="simon"){const activeStrikes=Math.min(2,state.strikes),translated=m.sequence.map(signal=>COLOR_NAMES[translatedSimon(signal,activeStrikes,state.caseInfo.vowel)]);return"Lösung für "+(state.caseInfo.vowel?"Seriennummer mit Vokal":"Seriennummer ohne Vokal")+" und "+activeStrikes+" Fehler: "+translated.join(" → ")+"."}
  if(m.type==="password")return"Lösung: "+m.target+" einstellen und absenden."
  return"Folge der ersten passenden Regel im Handbuch."
}
function finish(won,why){if(state.phase!=="playing")return;state.phase=won?"won":"lost";state.generation++;const solved=state.modules.filter(m=>m.solved).length;const outstanding=state.modules.filter(m=>!m.solved).map(m=>MODULE_META[m.type].title);let stars=0,copy="",explain="";if(won){document.body.classList.add("gift-open");$("#endEmoji").textContent="🎁✨🎄";$("#endEyebrow").textContent="Geschenk geöffnet · Einsatz erfolgreich";$("#endTitle").textContent="Frohe Weihnachten!";copy="Das Geschenk öffnet sich, die Werkstatt erstrahlt im Lichterglanz – Weihnachten ist gerettet!";stars=state.strikes===0&&state.remaining/state.totalTime>=.5?3:state.strikes<=1?2:1;$("#resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);explain="Alle Module gelöst. Gute Arbeit mit dem Handbuch!";makeConfetti()}else{$("#endEmoji").textContent=why==="strike"?"🔴💥🎁":"⏰❄️🎁";$("#endEyebrow").textContent="Nordpol-Einsatz beendet";$("#endTitle").textContent=why==="strike"?"Drei Kugeln zerbrochen":"Mitternacht ist da";copy=why==="strike"?"Das verhexte Geschenk ist in Glitzer zerplatzt.":"Der Countdown lief ab, bevor alle Module entschärft waren.";$("#resultStars").textContent="☆☆☆";if(why==="strike"&&state.lastIncident){explain="<strong>Letzter Fehler · "+state.lastIncident.module+":</strong> "+escapeHtml(state.lastIncident.reason)+"<br><strong>Handbuchhinweis:</strong> "+escapeHtml(state.lastIncident.hint)}else{explain="<strong>Noch offen:</strong> "+(outstanding.length?outstanding.map(escapeHtml).join(", "):"keine Module")+"<br><strong>Tipp:</strong> Nutze das Handbuch während der Runde. Jeder Fehler beschleunigt den Timer."}}$("#endCopy").textContent=copy;$("#resultTime").textContent=formatTime(state.remaining);$("#resultStrikes").textContent=state.strikes;$("#resultSolved").textContent=solved+"/"+state.modules.length;$("#resultExplain").innerHTML=explain;$("#endOverlay").hidden=false;$("#againButton").textContent="↻ Nochmal spielen";updateHud()}
// Add the one-shot finale after the common result screen is prepared.
const finishCore=finish;
finish=function(won,why){if(state.phase!=="playing")return;createEndOverlay();finishCore(won,why);if(won)playWin();if(!won&&why==="time"){const hints=state.modules.filter(m=>!m.solved).map(m=>"<li><strong>"+escapeHtml(MODULE_META[m.type].title)+":</strong> "+escapeHtml(solutionInstruction(m))+"</li>").join("");$("#resultExplain").innerHTML="<strong>Noch offen:</strong> "+state.modules.filter(m=>!m.solved).map(m=>escapeHtml(MODULE_META[m.type].title)).join(", ")+"<br><strong>Regeln für die offenen Module:</strong><ul>"+hints+"</ul>"}if(!won&&why==="strike"){const module=state.modules.find(m=>MODULE_META[m.type].title===state.lastIncident?.module);if(module)$("#resultExplain").innerHTML+="<br><strong>Richtige Regel und Lösung:</strong> "+escapeHtml(solutionInstruction(module));document.body.classList.add("gift-exploded");playExplosion();makeConfetti()}};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function makeConfetti(){const host=$("#confetti");host.innerHTML="";const palette=["#ffe07c","#fff9e9","#f26470","#69d99d","#7bdcff"];for(let i=0;i<90;i++){const p=document.createElement("i");p.style.left=(rand()*100)+"%";p.style.background=palette[i%palette.length];p.style.setProperty("--drift",((rand()-.5)*180)+"px");p.style.animationDelay=(rand()*1.4)+"s";p.style.animationDuration=(2.5+rand()*2)+"s";host.appendChild(p)}setTimeout(()=>{host.innerHTML=""},6500)}
function abortToMenu(){if(state.phase==="playing"){state.phase="menu";state.generation++;$("#startOverlay").hidden=false;$("#endOverlay").hidden=true;$("#confetti").innerHTML="";document.body.classList.remove("gift-open");setStatus("Runde abgebrochen.","");}}
function beginAgain(){startGame()}
function gameFrame(now){
  const dt=Math.max(0,now-state.lastFrame);state.lastFrame=now;
  if(state.phase==="playing"){state.remaining-=dt/1000*(1+state.strikes*.25);if(state.remaining<=0){state.remaining=0;updateHud();finish(false,"time")}else{const quantum=state.remaining<=30?Math.floor(state.remaining*2):Math.floor(state.remaining);if(quantum!==state.lastTick){state.lastTick=quantum;if(!muted)playTick(state.remaining<=30);updateHud()}}}
  if(state.phase==="playing")gameFrameId=requestAnimationFrame(gameFrame);else gameFrameId=0;
}// Snow is drawn locally so the file has no external asset dependency.
const snowCanvas=$("#snow"),snowCtx=snowCanvas.getContext("2d");let flakes=[];
function resizeSnow(){const dpr=Math.min(2,window.devicePixelRatio||1);snowCanvas.width=Math.floor(innerWidth*dpr);snowCanvas.height=Math.floor(innerHeight*dpr);snowCanvas.style.width=innerWidth+"px";snowCanvas.style.height=innerHeight+"px";snowCtx.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:Math.min(130,Math.floor(innerWidth/9))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.7+Math.random()*2,v:.35+Math.random()*1.1,drift:(Math.random()-.5)*.6}))}
function updateSnow(dt){snowCtx.clearRect(0,0,innerWidth,innerHeight);for(const f of flakes){f.y+=f.v*dt/16;f.x+=f.drift*dt/16;if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth}if(f.x<0)f.x=innerWidth;if(f.x>innerWidth)f.x=0;snowCtx.fillStyle="rgba(241,250,247,"+(.25+f.r*.12)+")";snowCtx.beginPath();snowCtx.arc(f.x,f.y,f.r,0,Math.PI*2);snowCtx.fill()}}
function snowFrame(now){const dt=Math.min(80,Math.max(0,now-(snowFrame.last||now)));snowFrame.last=now;updateSnow(dt);snowFrameId=requestAnimationFrame(snowFrame)}

function ensureAudio(){if(muted)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}catch{}}
function startBackgroundMusic(){const music=$("#backgroundMusic");if(!music||muted)return;music.volume=.24;music.muted=false;const playback=music.play();if(playback&&typeof playback.catch==="function")playback.catch(()=>{})}
function tone(freq,duration,type,volume,delay){if(muted)return;try{ensureAudio();if(!audioContext)return;const start=audioContext.currentTime+(delay||0),osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type||"sine";osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(volume||.035,start);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+duration)}catch{}}
function playClick(){tone(820,.035,"square",.018)}
function playTick(urgent){tone(urgent?1050:710,urgent?.055:.035,"sine",urgent?.024:.013)}
function playGlass(){tone(1430,.32,"sine",.06);tone(920,.38,"triangle",.045,.04);tone(1860,.24,"sine",.025,.08)}
function playBell(){tone(880,.55,"sine",.055);tone(1320,.6,"sine",.035,.08);tone(1760,.7,"sine",.022,.16)}
function playExplosion(){if(muted)return;try{ensureAudio();if(!audioContext)return;const length=Math.floor(audioContext.sampleRate*.65),buffer=audioContext.createBuffer(1,length,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();source.buffer=buffer;filter.type="lowpass";filter.frequency.setValueAtTime(1700,audioContext.currentTime);filter.frequency.exponentialRampToValueAtTime(80,audioContext.currentTime+.62);gain.gain.setValueAtTime(.22,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.65);source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);source.start()}catch{}tone(110,.65,"sawtooth",.08)}
function playWin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,"sine",.035,i*.16))}
let lastButtonPointer=null;
function releaseHeldButton(m){
  if(!m||!m.holding)return;
  const digit=rules.timerDigits[m.strip],digits=formatTime(state.remaining).replace(":","");m.holding=false;
  if(digits.includes(String(digit)))solveModule(m,"Der Knopf wurde beim richtigen Ziffern-Treffer losgelassen.");
  else strike("Der Knopf wurde beim falschen Ziffernstand losgelassen.","Der Farbstreifen "+COLOR_NAMES[m.strip]+" verlangt die Ziffer "+digit+". Warte, bis sie in mm:ss sichtbar ist.",m);
}
document.addEventListener("pointerdown",e=>{
  const button=e.target.closest('[data-action="bell-press"]');if(!button||state.phase!=="playing")return;
  e.preventDefault();lastButtonPointer=button;const card=button.closest(".module-card"),m=state.modules.find(x=>x.id===card?.dataset.module);
  if(m)moduleMap[m.type].input(m,"bell-press",{},m.id);
  if(button.setPointerCapture&&e.pointerId!==undefined){try{button.setPointerCapture(e.pointerId)}catch{}}
});
document.addEventListener("pointerup",()=>{if(!lastButtonPointer)return;const card=lastButtonPointer.closest(".module-card"),m=state.modules.find(x=>x.id===card?.dataset.module);lastButtonPointer=null;releaseHeldButton(m)},true);
document.addEventListener("pointercancel",()=>{if(!lastButtonPointer)return;const card=lastButtonPointer.closest(".module-card"),m=state.modules.find(x=>x.id===card?.dataset.module);if(m&&m.holding){m.holding=false;renderModules()}lastButtonPointer=null});function playSimon(id,m){if(state.phase!=="playing"||m.playing)return;const gen=state.generation,signals=m.sequence.slice(0,Math.min(4,m.stage));m.playing=true;m.feedback="Sieh dir die Signalfolge an und übersetze jede Farbe im Handbuch.";renderModules();let i=0;const step=()=>{if(state.phase!=="playing"||gen!==state.generation)return;if(i>=signals.length){m.flash=null;m.playing=false;renderModules();return}m.flash=signals[i];tone(({red:460,green:610,gold:790,blue:920})[signals[i]],.18,"sine",.025);renderModules();setTimeout(()=>{if(state.phase!=="playing"||gen!==state.generation)return;m.flash=null;renderModules();i++;setTimeout(step,180)},350)};setTimeout(step,450)}
document.addEventListener("click",e=>{
  const pageButton=e.target.closest("[data-page]");if(pageButton){playClick();setManualPage(pageButton.dataset.page);return}
  const button=e.target.closest("[data-action]");if(!button)return;const action=button.dataset.action;
  if(action==="start"){startGame();return}
  
  if(action==="menu-back"){showMenu();return}
  if(action==="again"){beginAgain();return}
  if(action==="mute"){muted=!muted;button.textContent=muted?"🔇":"🔊";button.setAttribute("aria-label",muted?"Ton einschalten":"Ton ausschalten");const music=$("#backgroundMusic");if(music)music.muted=muted;if(!muted){ensureAudio();startBackgroundMusic()}playClick();return}
  if(action==="print-handbook"){playClick();printHandbook();return}
  if(action==="show-book"||action==="show-box"){const layout=$("#layout");if(!layout)return;layout.classList.toggle("show-book",action==="show-book");layout.classList.toggle("show-box",action==="show-box");$("#bookTab").classList.toggle("active",action==="show-book");$("#boxTab").classList.toggle("active",action==="show-box");return}
  if(action==="bell-press")return;
  const card=button.closest(".module-card");if(!card||state.phase!=="playing")return;const m=state.modules.find(x=>x.id===card.dataset.module);if(!m)return;playClick();moduleMap[m.type].input(m,action,button.dataset,m.id);
});
document.addEventListener("input",e=>{if(e.target.id!=="manualSearch")return;const value=e.target.value.trim();if(value)filterManual(value);else renderManual()});
document.addEventListener("keydown",e=>{
  if((e.key!==" "&&e.key!=="Enter")||e.repeat)return;const button=e.target.closest('[data-action="bell-press"]');if(!button)return;
  const card=button.closest(".module-card"),m=state.modules.find(x=>x.id===card?.dataset.module);if(!m||state.phase!=="playing")return;
  e.preventDefault();keyboardHoldId=m.id;moduleMap[m.type].input(m,"bell-press",{},m.id);
},true);
document.addEventListener("keyup",e=>{
  if(e.key!==" "&&e.key!=="Enter")return;const m=state.modules.find(x=>x.id===keyboardHoldId);keyboardHoldId=null;releaseHeldButton(m);
},true);
window.addEventListener("resize",resizeSnow);window.addEventListener("blur",()=>{if(lastButtonPointer){const card=lastButtonPointer.closest(".module-card"),m=state.modules.find(x=>x.id===card?.dataset.module);if(m&&m.holding){m.holding=false;renderModules()}lastButtonPointer=null}keyboardHoldId=null});
prepareShell();createLights();resizeSnow();renderHeader();renderStartMenu();snowFrameId=requestAnimationFrame(snowFrame);
})();
</script>
