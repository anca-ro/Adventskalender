<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07152d">
<meta name="description" content="Baue eine winterliche Brücke für den Weihnachtsschlitten.">
<title>Nordlicht-Brückenbau – Winterliches Brückenspiel</title>
<style>
:root{color-scheme:dark;--ink:#f4f8ff;--muted:#b6cee5;--blue:#73d9f2;--gold:#ffd779;--panel:#0a1b35;--line:#bdeaff40;--green:#83e6b5;--red:#ff8a91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061128;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.shell{height:100dvh;min-height:320px;width:min(100%,1380px);margin:0 auto;padding:clamp(6px,1.2vw,14px);display:grid;grid-template-rows:auto minmax(150px,1fr) auto auto;gap:clamp(5px,1vw,10px)}
.topbar{display:flex;align-items:center;gap:10px;min-height:50px}
.brandmark{height:42px;width:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid #b8eaff55;border-radius:14px;background:linear-gradient(145deg,#173a58,#102541);font-size:23px;box-shadow:0 0 22px #78daff22}
.title-area{min-width:0;flex:1}
.eyebrow{margin:0;color:#a9dafa;font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
h1{margin:1px 0 0;font-size:clamp(17px,2vw,24px);line-height:1.15;color:#fff}
#levelHint{margin:2px 0 0;color:#c6d9e9;font-size:clamp(10px,1.2vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn,.tool-btn,.mat-btn,.primary,.secondary,.level-card{border:1px solid #c7eaff48;background:linear-gradient(145deg,#142c49,#0b1e38);border-radius:13px;min-height:44px;cursor:pointer;box-shadow:0 3px 10px #0003;transition:transform .12s,border-color .12s,background .12s}
.icon-btn{width:46px;flex:0 0 46px;font-size:19px}
button:hover{border-color:#8ddffa;background-color:#163655}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #ffdf83;outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed;filter:saturate(.5)}
.arena{position:relative;overflow:hidden;min-height:0;border:1px solid #9ee5ff60;border-radius:19px;background:#07172e;box-shadow:0 10px 34px #0007,inset 0 0 35px #54b8ff12}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:1;inset:10px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud-group{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.pill{padding:6px 10px;border:1px solid #c8eaff49;border-radius:999px;background:#06162de8;color:#f4fbff;font-size:clamp(11px,1.3vw,14px);font-weight:780;text-shadow:0 1px 5px #000;box-shadow:0 3px 12px #0004}
.pill strong{color:#ffdb7e}
.toast{position:absolute;z-index:3;left:50%;bottom:12px;transform:translate(-50%,10px);max-width:min(92%,620px);padding:9px 15px;border:1px solid #fff5;border-radius:999px;background:#07152ded;color:white;font-size:13px;font-weight:750;text-align:center;box-shadow:0 6px 20px #0008;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool-group{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid #9ddcff30;border-radius:15px;background:#08182e}
.tool-label{padding:0 4px;color:#9dbbd4;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.tool-btn{padding:0 11px;white-space:nowrap;font-size:12px;font-weight:750}
.tool-btn[aria-pressed="true"],.mat-btn[aria-pressed="true"]{border-color:#ffd779;background:linear-gradient(145deg,#624c28,#382e25);box-shadow:0 0 0 1px #ffd77933,0 3px 12px #ffd77915}
.mat-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;min-width:48px;font-size:12px;font-weight:800;white-space:nowrap}
.mat-btn .emoji{font-size:17px}
.toolbar-spacer{flex:1}
.primary,.secondary{padding:0 16px;white-space:nowrap;font-weight:850}
.primary{border:0;background:linear-gradient(135deg,#fff0b5,#f3bd55);color:#30220b;box-shadow:0 4px 0 #a97126,0 6px 16px #0004}
.primary:hover{background:linear-gradient(135deg,#fff5cf,#ffd36c);color:#30220b}
.secondary{background:linear-gradient(145deg,#163955,#0b233b)}
.statusline{min-height:17px;color:#b3cce0;font-size:11px;text-align:center}
.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,#0c2849d9,#020713ed)}
.overlay[hidden]{display:none}
.dialog{width:min(94vw,540px);max-height:min(90dvh,820px);overflow:auto;padding:clamp(20px,4vw,34px);border:1px solid #c7eaff70;border-radius:24px;background:linear-gradient(145deg,#122e4df5,#091a33f7);box-shadow:0 24px 80px #000b,0 0 44px #70d9ff1c;text-align:center}
.dialog.wide{width:min(96vw,820px)}
.ornament{color:#ffd779;font-size:22px;letter-spacing:.4em}
.dialog h2{margin:10px 0 8px;font-size:clamp(24px,6vw,38px);line-height:1.06;color:white;text-shadow:0 0 24px #93dfff55}
.dialog p{margin:10px auto;color:#d4e8f4;line-height:1.55}
.dialog .small{font-size:12px;color:#afc8da}
.dialog-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}
.dialog-actions button{min-width:116px;min-height:46px}
.level-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 4px}
.level-card{min-height:92px;padding:9px 6px;text-align:left}
.level-card .num{display:block;color:#ffd779;font-size:10px;font-weight:900;letter-spacing:.12em}
.level-card .name{display:block;margin-top:3px;font-size:12px;font-weight:850;line-height:1.15}
.level-card .stars{display:block;margin-top:5px;color:#ffe18a;font-size:12px}
.level-card.locked{opacity:.48;cursor:not-allowed}
.level-card.done{border-color:#f7d47580;background:linear-gradient(145deg,#3a3629,#10253a)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.howto div{padding:12px 10px;border:1px solid #c4eaff31;border-radius:14px;background:#06182da8;font-size:12px;line-height:1.45}
.howto b{display:block;margin-bottom:5px;color:#ffe18a}
.hide{display:none!important}
@media(max-width:650px){
 .shell{padding:6px;grid-template-rows:auto minmax(140px,1fr) auto auto;gap:5px}
 .topbar{min-height:44px;gap:6px}.brandmark{width:36px;height:36px;flex-basis:36px;border-radius:12px;font-size:20px}
 #levelHint{font-size:10px}.icon-btn{width:42px;flex-basis:42px;min-height:42px}
 .arena{border-radius:13px}.hud{inset:6px 6px auto;gap:4px}.hud-group{gap:4px}.pill{padding:5px 8px;font-size:10px}
 .toolbar{gap:4px}.tool-group{gap:3px;padding:3px;border-radius:12px}.tool-label{font-size:8px;padding:0 2px}
 .tool-btn{padding:0 8px;min-height:44px;font-size:11px}.mat-btn{min-height:44px;padding:0 7px;font-size:10px;gap:3px}
 .primary,.secondary{min-height:44px;padding:0 12px;font-size:12px}.statusline{font-size:10px;min-height:14px}
 .level-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.level-card{min-height:74px}
 .howto{grid-template-columns:1fr;gap:6px}.howto div{text-align:left}
}
@media(max-width:390px){.tool-label{display:none}.tool-btn{padding:0 7px}.mat-btn{padding:0 6px}.toolbar-spacer{display:none}.toolbar{justify-content:center}}
@media(orientation:landscape) and (max-height:520px){
 .shell{padding:5px;gap:4px;grid-template-rows:auto minmax(120px,1fr) auto auto}
 .topbar{min-height:38px}.brandmark{height:34px;width:34px;flex-basis:34px}.icon-btn{min-height:38px;width:40px;flex-basis:40px}
 .arena{border-radius:11px}.toolbar{gap:3px}.tool-btn,.mat-btn,.primary,.secondary{min-height:40px}
 .statusline{display:none}
}
</style>
</head>
<body>
<div class="shell">
 <header class="topbar">
  <div class="brandmark" aria-hidden="true">🌉</div>
  <div class="title-area"><p class="eyebrow" id="stateLabel">NORDLICHT-BRÜCKENBAU</p><h1 id="levelTitle">Eine Brücke für den Schlitten</h1><p id="levelHint">Baue eine sichere Strecke durch den Schnee.</p></div>
  <button id="tipBtn" class="icon-btn" type="button" aria-label="Tipp zum Level" title="Tipp">💡</button>
  <button id="soundBtn" class="icon-btn" type="button" aria-label="Ton ein- oder ausschalten" title="Ton">🔔</button>
  <button id="menuBtn" class="icon-btn" type="button" aria-label="Levelmenü öffnen" title="Menü">☰</button>
 </header>
 <main class="arena" id="arena">
  <canvas id="canvas" aria-label="Winterliche Brückenbaustelle. Ziehe von einem Knoten zu einem Punkt, um einen Stab zu bauen."></canvas>
  <div id="hud" class="hud hide" aria-live="polite">
   <div class="hud-group"><div class="pill" id="hudLevel">Level 1/8</div><div class="pill">Budget: <strong id="hudBudget">0 / 0 ✦</strong></div></div>
   <div class="hud-group"><div class="pill" id="hudMode">Bauen</div><div class="pill" id="hudLoad">Brücke bereit</div></div>
  </div>
  <div id="toast" class="toast" aria-live="assertive"></div>
 </main>
 <nav id="toolbar" class="toolbar" aria-label="Brückenbau-Werkzeuge">
  <div class="tool-group" aria-label="Werkzeug">
   <span class="tool-label">Werkzeug</span>
   <button id="buildTool" class="tool-btn" type="button" aria-pressed="true">🛠️ Bauen</button>
   <button id="deleteTool" class="tool-btn" type="button" aria-pressed="false">🧹 Löschen</button>
  </div>
  <div class="tool-group" aria-label="Material">
   <span class="tool-label">Material</span>
   <button class="mat-btn" data-material="road" type="button" aria-label="Zuckerstangen-Fahrbahn auswählen" title="Fahrbahn · stabil, mittlerer Preis" aria-pressed="true"><span class="emoji">🍬</span>Fahrbahn</button>
   <button class="mat-btn" data-material="wood" type="button" aria-label="Holzstütze auswählen" title="Stütze · günstig, begrenzte Tragkraft" aria-pressed="false"><span class="emoji">🪵</span>Stütze</button>
   <button class="mat-btn" data-material="rope" type="button" aria-label="Lichterseil auswählen" title="Lichterseil · günstig, trägt nur auf Zug" aria-pressed="false"><span class="emoji">✨</span>Seil</button>
  </div>
  <div class="toolbar-spacer"></div>
  <div class="tool-group" aria-label="Bearbeiten">
   <button id="undoBtn" class="tool-btn" type="button" aria-label="Rückgängig" title="Rückgängig · Strg+Z">↶</button>
   <button id="redoBtn" class="tool-btn" type="button" aria-label="Wiederholen" title="Wiederholen · Strg+Y">↷</button>
   <button id="resetBtn" class="tool-btn" type="button" aria-label="Brücke zurücksetzen">♻️ Reset</button>
  </div>
  <button id="runBtn" class="primary" type="button">▶ Schlitten starten</button>
 </nav>
 <div id="statusLine" class="statusline" aria-live="polite">Ziehe von einem Knotenpunkt zu einem Rasterpunkt, um einen Stab zu bauen.</div>
</div>

<section id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
 <div id="dialog" class="dialog">
  <div class="ornament" aria-hidden="true">✦ ❄ ✦</div>
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div id="dialogActions" class="dialog-actions"></div>
 </div>
</section>

<script>
(()=>{'use strict';
/* 1. Level, Material und Physik-Konfiguration */
const WORLD={w:1120,h:620,grid:25,ground:620};
const MATERIALS={
 road:{name:'Fahrbahn',cost:.20,max:150,color:'#f6f3e7',dark:'#ad3344',compliance:.00008,limit:.28,width:13},
 wood:{name:'Stütze',cost:.085,max:205,color:'#b8793e',dark:'#603c2c',compliance:.00004,limit:.20,width:9},
 rope:{name:'Lichterseil',cost:.05,max:260,color:'#86e5b8',dark:'#184b53',compliance:.00012,limit:.33,width:5}
};
const LEVELS=[
 {title:'Der erste Schneegraben',hint:'Drei Zuckerstangen-Balken bilden eine einfache Fahrbahn. Ein kleines Dreieck in der Mitte hält den Schlitten ruhig.',budget:150,anchors:[[350,410,'start'],[770,410,'goal']],start:[366,397],goal:[858,410],allowed:['road'],mass:.80,speed:112,cliffs:[[[0,250],[275,260],[320,340],[350,410],[350,620],[0,620]],[[770,410],[800,345],[848,265],[1120,250],[1120,620],[770,620]]],islands:[]},
 {title:'Eiszapfen-Schlucht',hint:'Stütze die Fahrbahn mit einem umgedrehten V aus Holz. Die Seile bleiben noch im Elfenschuppen.',budget:290,anchors:[[330,410,'start'],[790,410,'goal']],start:[346,397],goal:[876,410],allowed:['road','wood'],mass:.88,speed:116,cliffs:[[[0,235],[255,246],[300,330],[330,410],[330,620],[0,620]],[[790,410],[822,330],[865,248],[1120,235],[1120,620],[790,620]]],islands:[]},
 {title:'Lebkuchen-Brücke',hint:'Die Ausfahrt liegt höher. Führe die Fahrbahn in vier Abschnitten bergauf und verankere die Mitte mit Holz.',budget:350,anchors:[[315,435,'start'],[805,350,'goal']],start:[331,422],goal:[887,350],allowed:['road','wood'],mass:.92,speed:118,cliffs:[[[0,260],[242,270],[284,360],[315,435],[315,620],[0,620]],[[805,350],[842,305],[888,266],[1120,260],[1120,620],[805,620]]],islands:[]},
 {title:'Lichterketten-Tal',hint:'Eine tiefe Schlucht braucht ein Hängewerk. Baue erst die Fahrbahn, dann ein hohes Dreieck aus Stützen und Zugseilen.',budget:430,anchors:[[285,415,'start'],[835,415,'goal']],start:[301,402],goal:[923,415],allowed:['road','wood','rope'],mass:1.02,speed:120,cliffs:[[[0,245],[220,250],[257,334],[285,415],[285,620],[0,620]],[[835,415],[865,332],[905,250],[1120,245],[1120,620],[835,620]]],islands:[]},
 {title:'Der Tannenwald',hint:'Die Insel in der Mitte ist ein fester Anker. Baue zwei kürzere Fahrbahnspannen zu ihr und verstrebe beide Seiten.',budget:470,anchors:[[270,420,'start'],[560,386,'mid'],[850,420,'goal']],start:[286,407],goal:[936,420],allowed:['road','wood','rope'],mass:1.05,speed:120,cliffs:[[[0,248],[205,255],[240,340],[270,420],[270,620],[0,620]],[[850,420],[880,340],[915,255],[1120,248],[1120,620],[850,620]]],islands:[[[485,620],[497,456],[523,402],[560,386],[597,402],[623,456],[635,620]]]},
 {title:'Zugbrücke der Elfen',hint:'Der Geschenkwagen ist schwerer und das Budget knapp. Nutze kurze Planken und ein sparsames Seil-Dreieck.',budget:320,anchors:[[325,410,'start'],[795,410,'goal']],start:[341,397],goal:[882,410],allowed:['road','wood','rope'],mass:1.45,speed:115,cliffs:[[[0,238],[247,248],[291,330],[325,410],[325,620],[0,620]],[[795,410],[830,330],[873,248],[1120,238],[1120,620],[795,620]]],islands:[]},
 {title:'Nordpol-Express',hint:'Der lange Zug rollt schneller an. Eine hohe Fachwerkbrücke mit mehreren Dreiecken verteilt die Last.',budget:460,anchors:[[290,415,'start'],[830,385,'goal']],start:[306,402],goal:[916,385],allowed:['road','wood','rope'],mass:1.25,speed:140,cliffs:[[[0,250],[220,258],[260,340],[290,415],[290,620],[0,620]],[[830,385],[867,322],[908,258],[1120,250],[1120,620],[830,620]]],islands:[]},
 {title:'Heiligabend-Finale',hint:'Zwei lange Spannweiten treffen auf der Mittelinsel zusammen. Plane sechs kurze Planken und verankere jedes Feld mit Dreiecken.',budget:590,anchors:[[245,425,'start'],[560,385,'mid'],[875,425,'goal']],start:[261,412],goal:[958,425],allowed:['road','wood','rope'],mass:1.5,speed:132,cliffs:[[[0,256],[175,266],[211,347],[245,425],[245,620],[0,620]],[[875,425],[909,347],[945,266],[1120,256],[1120,620],[875,620]]],islands:[[[462,620],[480,454],[516,399],[560,385],[604,399],[640,454],[658,620]]]}
];
const PHYS={step:1/60,gravity:430,damping:.992,iterations:9,dtMax:.05};
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s);
const ui={levelTitle:$('#levelTitle'),levelHint:$('#levelHint'),stateLabel:$('#stateLabel'),hud:$('#hud'),hudLevel:$('#hudLevel'),hudBudget:$('#hudBudget'),hudMode:$('#hudMode'),hudLoad:$('#hudLoad'),status:$('#statusLine'),toast:$('#toast'),overlay:$('#overlay'),dialog:$('#dialog'),dialogTitle:$('#dialogTitle'),dialogBody:$('#dialogBody'),dialogActions:$('#dialogActions'),run:$('#runBtn'),undo:$('#undoBtn'),redo:$('#redoBtn')};
let state='menu',levelIndex=0,level=LEVELS[0],nodes=[],edges=[],idNext=1,selectedMaterial='road',tool='build',history=[],future=[],savedBuild=null,routeNodes=[],routeEdges=[],ride={distance:0,index:0,x:0,y:0,angle:0},paused=false,toastTimer=0,accumulator=0,lastFrame=0,scoreData={unlocked:1,stars:Array(LEVELS.length).fill(0)},soundOn=true,audio=null,tutShown=false,menuReturnState=null;
let view={scale:1,ox:0,oy:0,dpr:1,w:1,h:1};
const pointer={down:false,id:null,start:null,world:null,last:null,source:null,moved:false};
const snow=[];
const stars=[];
const colors=['#b5f5ff','#fff1bf','#d9d1ff','#ffffff'];
let seed=81723;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<100;i++)stars.push({x:rand()*WORLD.w,y:rand()*310,r:.5+rand()*1.4,a:.25+rand()*.7,phase:rand()*6.28});
for(let i=0;i<72;i++)snow.push({x:rand()*WORLD.w,y:rand()*WORLD.h,r:1+rand()*2.1,v:20+rand()*45,drift:-9+rand()*18,phase:rand()*6.28});
function safeLoad(){try{const d=JSON.parse(localStorage.getItem('nordlichtBrueckenbauV1')||'null');if(d&&Number.isFinite(d.unlocked)&&Array.isArray(d.stars)){scoreData.unlocked=Math.max(1,Math.min(LEVELS.length,d.unlocked));scoreData.stars=LEVELS.map((_,i)=>Math.max(0,Math.min(3,Number(d.stars[i])||0)));}}catch(_){scoreData={unlocked:1,stars:Array(LEVELS.length).fill(0)};}}
function safeSave(){try{localStorage.setItem('nordlichtBrueckenbauV1',JSON.stringify(scoreData));}catch(_){}}
function makeNode(x,y,kind){return{id:idNext++,x,y,px:x,py:y,kind:kind||'joint'};}
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.hypot(dx,dy);}
function findNode(id){for(let i=0;i<nodes.length;i++)if(nodes[i].id===id)return nodes[i];return null;}
function costOf(edge){return dist(findNode(edge.a),findNode(edge.b))*MATERIALS[edge.material].cost;}
function spent(){let sum=0;for(const e of edges)sum+=costOf(e);return sum;}
function snapshot(){return{next:idNext,nodes:nodes.map(n=>({id:n.id,x:n.x,y:n.y,kind:n.kind})),edges:edges.map(e=>({id:e.id,a:e.a,b:e.b,material:e.material,rest:e.rest,stress:0,broken:false}))};}
function applySnapshot(s){idNext=s.next;nodes=s.nodes.map(n=>makeNode(n.x,n.y,n.kind));nodes.forEach((n,i)=>n.id=s.nodes[i].id);idNext=s.next;edges=s.edges.map(e=>({...e,stress:0,broken:false}));}
function remember(){history.push(snapshot());if(history.length>40)history.shift();future.length=0;syncButtons();}
function undo(){if(state!=='build'||!history.length)return;future.push(snapshot());applySnapshot(history.pop());selectedSource=null;updateHud();syncButtons();sound('tap');}
function redo(){if(state!=='build'||!future.length)return;history.push(snapshot());applySnapshot(future.pop());selectedSource=null;updateHud();syncButtons();sound('tap');}
function syncButtons(){ui.undo.disabled=state!=='build'||!history.length;ui.redo.disabled=state!=='build'||!future.length;$('#resetBtn').disabled=state!=='build';$('#buildTool').disabled=state!=='build';$('#deleteTool').disabled=state!=='build';for(const b of document.querySelectorAll('.mat-btn')){const ok=state==='build'&&level.allowed.includes(b.dataset.material);b.disabled=!ok;b.setAttribute('aria-pressed',String(selectedMaterial===b.dataset.material));}ui.run.textContent=state==='sim'?(paused?'▶ Weiter':'Ⅱ Pause'):state==='result'?'↶ Zurück zum Bauen':'▶ Schlitten starten';ui.run.disabled=state==='menu';}
function toast(message){ui.toast.textContent=message;ui.toast.classList.add('show');toastTimer=2.5;}
function updateHud(){const s=spent();ui.hudBudget.textContent=Math.round(s)+' / '+level.budget+' ✦';ui.hudLevel.textContent='Level '+(levelIndex+1)+' / '+LEVELS.length;ui.hudMode.textContent=state==='sim'?(paused?'Pause':'Simulation'):state==='result'?'Ergebnis':'Bauen';ui.hudLoad.textContent=state==='sim'?'Last: '+(level.mass>1.2?'schwer':'normal'):state==='result'?'Brücke ausgewertet':'Brücke bereit';ui.levelTitle.textContent=state==='menu'?'Eine Brücke für den Schlitten':level.title;ui.levelHint.textContent=state==='menu'?'Baue eine sichere Strecke durch den Schnee.':level.hint;ui.stateLabel.textContent=state==='sim'?'DER SCHLITTEN ROLLT':state==='result'?'LEVEL-AUSWERTUNG':state==='menu'?'NORDLICHT-BRÜCKENBAU':'LEVEL '+String(levelIndex+1).padStart(2,'0')+' · BAUMODUS';ui.hud.classList.toggle('hide',state==='menu');syncButtons();}

function edgeExists(a,b){return edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));}
function pointInPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1]+1e-9)+a[0]))c=!c;}return c;}

function buildRoute(){const start=nodes.find(n=>n.kind==='start'),goal=nodes.find(n=>n.kind==='goal');if(!start||!goal)return null;const adjacency=new Map();for(const n of nodes)adjacency.set(n.id,[]);for(const e of edges){if(e.material!=='road'||e.broken)continue;if(!adjacency.has(e.a)||!adjacency.has(e.b))continue;adjacency.get(e.a).push({to:e.b,e});adjacency.get(e.b).push({to:e.a,e});}const queue=[start.id],prev=new Map([[start.id,null]]);for(let q=0;q<queue.length;q++){const id=queue[q];if(id===goal.id)break;for(const x of adjacency.get(id)||[])if(!prev.has(x.to)){prev.set(x.to,{from:id,e:x.e});queue.push(x.to);}}if(!prev.has(goal.id))return null;const ns=[goal.id],es=[];let at=goal.id;while(at!==start.id){const p=prev.get(at);es.push(p.e);at=p.from;ns.push(at);}ns.reverse();es.reverse();return{nodes:ns,edges:es};}
function beginSimulation(){if(state!=='build')return;const route=buildRoute();if(!route){toast('Die Fahrbahn hat noch keine durchgehende Verbindung. Verbinde beide Anker mit Fahrbahn.');return;}if(spent()>level.budget+.01){toast('Das Budget ist überschritten.');return;}savedBuild=snapshot();routeNodes=route.nodes;routeEdges=route.edges;ride={distance:16,index:0,x:level.start[0],y:level.start[1],angle:0};for(const n of nodes){n.px=n.x;n.py=n.y;}for(const e of edges)e.stress=0;state='sim';paused=false;accumulator=0;ui.status.textContent='Fahre mit dem Schlitten über die Brücke. Leertaste pausiert.';updateHud();sound('start');}

function stepPhysics(dt){
 if(state!=='sim'||paused)return;
 for(const n of nodes){
  if(n.kind==='start'||n.kind==='goal'||n.kind==='mid'){n.px=n.x;n.py=n.y;continue;}
  const vx=(n.x-n.px)*PHYS.damping,vy=(n.y-n.py)*PHYS.damping;
  n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+PHYS.gravity*dt*dt;
 }
 if(ride.index<routeEdges.length){
  const i=ride.index,a=findNode(routeNodes[i]),b=findNode(routeNodes[i+1]);
  if(a&&b){
   const len=Math.max(1,dist(a,b)),t=Math.min(1,ride.distance/len);
   const load=PHYS.gravity*level.mass*dt*dt*2.1;
   if(a.kind==='joint')a.y+=load*(1-t);
   if(b.kind==='joint')b.y+=load*t;
   ride.x=a.x+(b.x-a.x)*t;ride.y=a.y+(b.y-a.y)*t-17;
   ride.angle=Math.atan2(b.y-a.y,b.x-a.x);ride.distance+=level.speed*dt;
   if(ride.distance>=len){ride.distance-=len;ride.index++;}
  }
 }
 stressScratch.length=edges.length;stressScratch.fill(0);
 lambdaScratch.length=edges.length;lambdaScratch.fill(0);
 for(let k=0;k<PHYS.iterations;k++){
  for(let j=0;j<edges.length;j++){
   const e=edges[j];if(e.broken)continue;
   const a=findNode(e.a),b=findNode(e.b);if(!a||!b)continue;
   const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(.001,Math.hypot(dx,dy));
   const m=MATERIALS[e.material],strain=(len-e.rest)/e.rest;
   const stress=e.material==='rope'?Math.max(0,strain)/m.limit:Math.abs(strain)/m.limit;
   if(stress>stressScratch[j])stressScratch[j]=stress;
   if(e.material==='rope'&&len<=e.rest)continue;
   const ia=a.kind==='joint'?1:0,ib=b.kind==='joint'?1:0,sum=ia+ib;
   if(sum===0)continue;
   const alpha=m.compliance/(dt*dt);
   const deltaLambda=(-(len-e.rest)-alpha*lambdaScratch[j])/(sum+alpha);
   lambdaScratch[j]+=deltaLambda;
   const correction=-deltaLambda/len;
   a.x+=dx*correction*ia;a.y+=dy*correction*ia;
   b.x-=dx*correction*ib;b.y-=dy*correction*ib;
  }
 }
 for(let i=0;i<edges.length;i++){
  const e=edges[i];if(e.broken)continue;
  e.stress=Math.max((e.stress||0)*.88,stressScratch[i]);
  if(e.stress>1.28){
   e.broken=true;const a=findNode(e.a),b=findNode(e.b);
   if(a&&b)burst((a.x+b.x)/2,(a.y+b.y)/2,14,'#ffdf9a');
   toast('Knacks! Ein Stab ist gebrochen.');
  }
 }
 if(!findRoadPathStillValid()){finish(false,'Ein Fahrbahn-Stab ist gebrochen, und der Weg ist unterbrochen.');return;}
 if(ride.index>=routeEdges.length){finish(true,'Der Schlitten hat das Ziel erreicht.');return;}
 if(ride.y>WORLD.h-22||nodes.some(n=>n.kind==='joint'&&n.y>WORLD.h-16))
  finish(false,'Der Schlitten oder ein Gelenk ist in die Schlucht gefallen.');
}

 if(state==='build'){ctx.fillStyle='#cdeeff13';for(let x=25;x<WORLD.w;x+=WORLD.grid)for(let y=50;y<550;y+=WORLD.grid){ctx.fillRect(x-1,y-1,2,2);}}
}
function drawTree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#382d34';ctx.fillRect(-4,0,8,22);for(let i=0;i<3;i++){const yy=-i*19;ctx.fillStyle=i%2?'#175243':'#20634e';ctx.beginPath();ctx.moveTo(0,yy-27);ctx.lineTo(-23+i*3,yy+7);ctx.lineTo(23-i*3,yy+7);ctx.closePath();ctx.fill();ctx.strokeStyle='#e4f8ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14+i*2,yy-5);ctx.quadraticCurveTo(0,yy+1,14-i*2,yy-5);ctx.stroke();}ctx.restore();}
function drawGoal(){const gx=level.goal[0],gy=level.goal[1];ctx.save();ctx.globalAlpha=.45+.18*Math.sin(performance.now()*.004);ctx.strokeStyle='#ffe37a';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.ellipse(gx,gy-12,35,48,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();ctx.save();ctx.translate(gx+30,gy-14);ctx.fillStyle='#b33343';ctx.beginPath();ctx.moveTo(-16,6);ctx.lineTo(0,-13);ctx.lineTo(16,6);ctx.fill();ctx.fillStyle='#eadbbd';ctx.fillRect(-12,6,24,22);ctx.fillStyle='#f2c55a';ctx.fillRect(0,14,7,14);ctx.fillStyle='#d7e9f5';ctx.fillRect(4,-13,5,12);ctx.restore();}
function drawEdge(e){const a=findNode(e.a),b=findNode(e.b);if(!a||!b)return;const m=MATERIALS[e.material],dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),stress=e.stress||0;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 if(e.broken){ctx.strokeStyle='#644754';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+dx*.42,a.y+dy*.42+9);ctx.moveTo(a.x+dx*.58,a.y+dy*.58+9);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();return;}
 if(e.material==='road'){ctx.strokeStyle='#403545';ctx.lineWidth=m.width+5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#fff4df';ctx.lineWidth=m.width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#cb4652';ctx.lineWidth=4;ctx.setLineDash([10,10]);ctx.lineDashOffset=-performance.now()*.018;ctx.stroke();ctx.restore();}
 else if(e.material==='wood'){ctx.strokeStyle='#392f35';ctx.lineWidth=m.width+4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle=m.color;ctx.lineWidth=m.width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#edb875';ctx.lineWidth=1.5;ctx.setLineDash([4,14]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}
 else{ctx.shadowColor='#6bffd3';ctx.shadowBlur=11;ctx.strokeStyle='#183d4b';ctx.lineWidth=m.width+2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#66d9ac';ctx.lineWidth=2.4;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);for(let d=18;d<len;d+=35){const q=d/len;ctx.fillStyle=(Math.floor(d/35)%2)?'#ffd65f':'#8dffda';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(a.x+dx*q,a.y+dy*q,3.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}
 if(state==='sim'&&stress>.35){const c=stress>.8?'#ff4b59':stress>.58?'#ffc247':'#55bdea';ctx.strokeStyle=c;ctx.lineWidth=3+stress*2;ctx.setLineDash(stress>.8?[3,4]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}
 ctx.restore();}
function drawNodes(){for(const n of nodes){const isAnchor=n.kind!=='joint';ctx.save();if(isAnchor){ctx.fillStyle='#0a1b33';ctx.strokeStyle='#ffd779';ctx.lineWidth=3;ctx.beginPath();ctx.arc(n.x,n.y,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffe6a3';ctx.beginPath();ctx.arc(n.x,n.y,3.5,0,Math.PI*2);ctx.fill();}else{const picked=n.id===selectedSource;ctx.fillStyle=picked?'#ffd779':'#e8fbff';ctx.strokeStyle=picked?'#fff6c4':'#39728b';ctx.lineWidth=picked?3:2;ctx.beginPath();ctx.arc(n.x,n.y,picked?8:6,0,Math.PI*2);ctx.fill();ctx.stroke();}ctx.restore();}}
function drawVehicle(){if(state!=='sim'&&state!=='result')return;const x=ride.x,y=ride.y;ctx.save();ctx.translate(x,y);ctx.rotate(ride.angle);ctx.fillStyle='#9a273c';ctx.strokeStyle='#ffe9c0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-23,5);ctx.quadraticCurveTo(-18,15,17,12);ctx.quadraticCurveTo(31,9,27,2);ctx.lineTo(21,1);ctx.quadraticCurveTo(10,7,-11,1);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#ffd779';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,7);ctx.quadraticCurveTo(-31,16,-12,17);ctx.lineTo(20,14);ctx.stroke();ctx.fillStyle='#f8d7ac';ctx.beginPath();ctx.arc(-7,-3,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9e3440';ctx.fillRect(3,-12,12,10);ctx.fillStyle='#75d1ab';ctx.fillRect(14,-9,9,8);ctx.fillStyle='#ffe187';ctx.beginPath();ctx.arc(-4,-5,1.3,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawEffects(){for(const p of effects){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function render(now){const t=now/1000;ctx.setTransform(view.dpr*view.scale,0,0,view.dpr*view.scale,view.dpr*view.ox,view.dpr*view.oy);drawBackground(t);drawGoal();for(const e of edges)drawEdge(e);if(pointer.down&&pointer.start&&tool==='build'&&state==='build'&&pointer.source){const a=findNode(pointer.source),p=pointer.world;if(a&&p){const q=snapPoint(p);ctx.save();ctx.setLineDash([7,6]);ctx.lineWidth=4;ctx.strokeStyle='#ffd779cc';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff3b5';ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fill();ctx.restore();}}drawNodes();drawVehicle();drawEffects();for(const p of snow){ctx.globalAlpha=.42+.4*(.5+.5*Math.sin(t*1.5+p.phase));ctx.fillStyle='#e6f7ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.setTransform(1,0,0,1,0,0);}
function loop(now){if(!lastFrame)lastFrame=now;let dt=Math.min(PHYS.dtMax,(now-lastFrame)/1000);lastFrame=now;if(state==='sim'&&!paused){accumulator+=dt;while(accumulator>=PHYS.step){stepPhysics(PHYS.step);accumulator-=PHYS.step;}}updateEffects(dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show');}render(now);requestAnimationFrame(loop);}
function sound(kind){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const notes=kind==='win'?[660,880,1100]:kind==='break'?[180,120]:kind==='start'?[440,660]:[510];for(let i=0;i<notes.length;i++){const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='break'?'triangle':'sine';o.frequency.value=notes[i];g.gain.setValueAtTime(.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(kind==='win'?.075:.035,now+i*.09+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.16);o.connect(g);g.connect(audio.destination);o.start(now+i*.09);o.stop(now+i*.09+.18);}}catch(_){}}
function toggleSound(){soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔔':'🔕';$('#soundBtn').setAttribute('aria-label',soundOn?'Ton ausschalten':'Ton einschalten');if(soundOn)sound('tap');}
function onRun(){if(state==='build'){beginSimulation();return;}if(state==='sim'){paused=!paused;ui.status.textContent=paused?'Simulation pausiert. Tippe Weiter oder Leertaste.':'Der Schlitten rollt weiter.';updateHud();return;}if(state==='result'){hideDialog();returnToBuild();}}
$('#buildTool').addEventListener('click',()=>chooseTool('build'));$('#deleteTool').addEventListener('click',()=>chooseTool('delete'));document.querySelectorAll('.mat-btn').forEach(b=>b.addEventListener('click',()=>chooseMaterial(b.dataset.material)));$('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);$('#resetBtn').addEventListener('click',resetBuild);$('#runBtn').addEventListener('click',onRun);$('#tipBtn').addEventListener('click',showHint);$('#soundBtn').addEventListener('click',toggleSound);$('#menuBtn').addEventListener('click',showMenu);
window.addEventListener('keydown',ev=>{if(ev.target&&['INPUT','TEXTAREA'].includes(ev.target.tagName))return;if(ev.code==='Space'){ev.preventDefault();if(ui.overlay.hidden)onRun();}else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();undo();}else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='y'){ev.preventDefault();redo();}else if(ev.key==='Delete'||ev.key==='Backspace'){chooseTool('delete');}else if(ev.key==='Escape'){if(!ui.overlay.hidden){hideDialog();if(state==='menu'){if(menuReturnState==='sim'||menuReturnState==='result')returnToBuild();else{state=menuReturnState||'build';updateHud();}menuReturnState=null;}else updateHud();}else if(state==='sim'){paused=true;updateHud();}else showMenu();}else if(['1','2','3'].includes(ev.key)){const ids=['road','wood','rope'];chooseMaterial(ids[Number(ev.key)-1]);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='sim'){paused=true;updateHud();}});
window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(resize,100),{passive:true});
safeLoad();loadLevel(0,false);state='menu';showMenu();resize();requestAnimationFrame(loop);
})();
</script>
